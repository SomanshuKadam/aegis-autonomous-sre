name: aegis

services:
  signoz-mcp:
    image: signoz/signoz-mcp-server:latest
    container_name: aegis-signoz-mcp
    restart: unless-stopped
    environment:
      TRANSPORT_MODE: http
      MCP_SERVER_PORT: 8000
      SIGNOZ_URL: http://host.docker.internal:8080
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY}
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [aegis]

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-aegisadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-mydatabase}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./scripts/mongodb-index.sh:/opt/aegis/mongodb-index.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --host localhost --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [aegis]

  api:
    build:
      context: ./app
    container_name: aegis-api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-aegisadmin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGO_DATABASE:-mydatabase}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-mydatabase}
      OTEL_SERVICE_NAME: aegis-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=1.0.0
      AEGIS_MUTATION_CAPABILITY: none
    ports:
      - "8081:8081"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]

  inventory:
    build:
      context: ./app
    command: ["uvicorn", "aegis.inventory.main:app", "--host", "0.0.0.0", "--port", "8082"]
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-aegisadmin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGO_DATABASE:-mydatabase}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-mydatabase}
      OTEL_SERVICE_NAME: aegis-inventory
      AEGIS_MUTATION_CAPABILITY: none
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8082/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build:
      context: ./app
    command: ["uvicorn", "aegis.worker.main:app", "--host", "0.0.0.0", "--port", "8083"]
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-aegisadmin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGO_DATABASE:-mydatabase}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-mydatabase}
      OTEL_SERVICE_NAME: aegis-worker
      AEGIS_API_URL: http://api:8081
      AEGIS_MUTATION_CAPABILITY: none
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8083/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]
    deploy:
      resources:
        limits:
          memory: 256M

  workload:
    build:
      context: ./app
    command: ["uvicorn", "aegis.workload.main:app", "--host", "0.0.0.0", "--port", "8084"]
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-aegisadmin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGO_DATABASE:-mydatabase}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-mydatabase}
      OTEL_SERVICE_NAME: aegis-workload
      AEGIS_API_URL: http://api:8081
      AEGIS_NORMAL_WORKLOAD_ENABLED: ${AEGIS_NORMAL_WORKLOAD_ENABLED:-true}
      AEGIS_WORKLOAD_STATE_PATH: /state/runs.json
      AEGIS_WORKLOAD_INTERVAL_SECONDS: ${AEGIS_WORKLOAD_INTERVAL_SECONDS:-5}
      AEGIS_MUTATION_CAPABILITY: none
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8084/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]
    volumes:
      - workload-data:/state
    deploy:
      resources:
        limits:
          memory: 256M

  action-runner:
    build:
      context: ./app
    command: ["uvicorn", "aegis.runner.main:app", "--host", "0.0.0.0", "--port", "8085"]
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-aegisadmin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGO_DATABASE:-mydatabase}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-mydatabase}
      OTEL_SERVICE_NAME: aegis-action-runner
      AEGIS_MUTATION_CAPABILITY: runner
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8085/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    build:
      context: ./frontend
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]

  n8n:
    build:
      context: ./n8n
    container_name: aegis-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-aegis-local-encryption-key-change-before-shared-use}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-aegis-local-admin-password}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      NODES_EXCLUDE: "[]"
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      CODEX_HOME: /home/node/.codex
      AEGIS_API_URL: http://api:8081
      AEGIS_ORCHESTRATOR_TOKEN: ${AEGIS_ORCHESTRATOR_TOKEN:?AEGIS_ORCHESTRATOR_TOKEN must be set}
    ports:
      - "5678:5678"
    group_add:
      - ${DOCKER_GID}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - n8n-data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - ./codex/config.container.toml:/home/node/.codex/config.toml:ro
      - ${CODEX_AUTH_FILE}:/home/node/.codex/auth.json
      - ./codex/analysis-output.schema.json:/opt/aegis/analysis-output.schema.json:ro
      - ./codex/remediation-output.schema.json:/opt/aegis/remediation-output.schema.json:ro
      - ./scripts/aegis-agent.sh:/opt/aegis/aegis-agent.sh:ro
      - ./n8n/workflows:/opt/aegis/workflows:ro
    depends_on:
      signoz-mcp:
        condition: service_started
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aegis
      - signoz-network

volumes:
  mongodb-data:
  n8n-data:
  workload-data:

networks:
  aegis:
    name: aegis
    driver: bridge
  signoz-network:
    external: true
    name: signoz-network
